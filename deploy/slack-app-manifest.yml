display_information:
  name: SentinelPR
  description: PR analysis verdicts and authorized commit-bound reviewer decisions
features:
  bot_user:
    display_name: SentinelPR
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  interactivity:
    is_enabled: true
    request_url: https://slack-callback.example.com/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
