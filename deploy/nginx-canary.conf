# Weighted split between the stable and canary UniERP containers.
# CANARY_PERCENT is substituted at container start (envsubst), e.g. 10, 25, 50 or 100.

upstream stable { server unierp-stable:8000; }
upstream canary { server unierp-canary:8000; }

split_clients "${request_id}" $upstream_pool {
    ${CANARY_PERCENT}% canary;
    *                  stable;
}

server {
    listen 8080;
    location / {
        proxy_pass http://$upstream_pool;
        add_header X-Canary-Target $upstream_pool always;
        proxy_set_header Host $host;
    }
}
