# Repositories the benchmark generates pull requests for.
#
# `bases` are revisions to branch PRs from, oldest first; they give the temporal split
# (train on early bases, calibrate on the next, test on the latest). They can be SHAs,
# refs, or commit subjects (resolved with `git log --grep`).

repos:
  uni-erp:
    enabled: true
    seed: demo/uni-erp/history/seed_history.py   # rebuilt deterministically
    path: .sentinel/uni-erp-repo
    tracker_dir: .sentinel/uni-erp-repo-meta
    project_root: .
    package: unierp
    tests: tests
    hidden: bench/hidden/uni-erp
    bases: ["Release 1.1.0", "Release 1.2.0", "Release 1.3.0", "Release 1.4.0"]
    per_base:
      C1: 6
      FAULT: 36        # candidates; split by the oracle into C2 (caught) and HF (hidden)
      C2: 7
      HF: 7
      C3: 4
      C4: 4
      C5: 5
      C6: 5
      C7: 6

  # Two real open-source repositories complete the evaluation. Clone them, install their
  # test dependencies, write hidden oracle tests under bench/hidden/<name>/, then enable.
  humanize:
    enabled: false
    url: https://github.com/python-humanize/humanize
    path: .sentinel/repos/humanize
    project_root: .
    package: src/humanize
    tests: tests
    hidden: bench/hidden/humanize
    bases: ["4.8.0", "4.9.0", "4.10.0", "4.11.0"]
    per_base: {C1: 6, FAULT: 36, C2: 7, HF: 7, C3: 4, C4: 4, C5: 5, C6: 5, C7: 6}

  tablib:
    enabled: false
    url: https://github.com/jazzband/tablib
    path: .sentinel/repos/tablib
    project_root: .
    package: src/tablib
    tests: tests
    hidden: bench/hidden/tablib
    bases: ["v3.4.0", "v3.5.0", "v3.6.0", "v3.7.0"]
    per_base: {C1: 6, FAULT: 36, C2: 7, HF: 7, C3: 4, C4: 4, C5: 5, C6: 5, C7: 6}
