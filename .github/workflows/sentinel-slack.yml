name: SentinelPR Slack notification

on:
  workflow_run:
    workflows: ["SentinelPR"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  relay:
    if: >-
      vars.SENTINEL_SLACK_RELAY_URL != '' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment: sentinel-slack
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: sentinel-run-${{ github.event.workflow_run.pull_requests[0].number }}
          path: ${{ runner.temp }}/sentinel-slack
      - run: python -m pip install -r sentinel/requirements.txt
      - name: Relay the completed report
        env:
          SENTINEL_SLACK_RELAY_URL: ${{ vars.SENTINEL_SLACK_RELAY_URL }}
          SLACK_RELAY_TOKEN: ${{ secrets.SLACK_RELAY_TOKEN }}
          REPORT_PATH: ${{ runner.temp }}/sentinel-slack/run.json
        run: python -m sentinel.publish.slack_relay "$REPORT_PATH"
